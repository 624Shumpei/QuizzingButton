<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuizButton</title>
    <!-- 実在するPeerJS公開サーバー用のライブラリ -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #222222;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 最初の画面（役割選択） --- */
        #role-select-screen {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .role-card {
            flex: 1;
            max-width: 200px;
            height: 300px;
            background-color: #333333;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            outline: none;
            border: none;
        }

        .role-card:active {
            background-color: #444444;
        }

        /* アイコン配置 */
        .icon-player {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }
        .icon-player .big-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #888888;
        }
        .icon-player .small-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #888888;
        }

        .icon-host {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }
        .icon-host .circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #888888;
        }

        /* エラー時の左右揺れアニメーション */
        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-12px); }
            40% { transform: translateX(12px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
            100% { transform: translateX(0); }
        }
        .shake-error {
            animation: shake 0.4s ease-in-out;
        }

        /* --- 解答者画面 --- */
        #player-screen {
            background-color: #222222;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }

        .lamp-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .quiz-lamp {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background-color: #551111;
            transition: background-color 0.1s;
        }
        .quiz-lamp.active {
            background-color: #ff0000;
        }

        .button-container {
            margin-bottom: 40px;
        }
        .push-button {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #e53935;
            border: none;
            cursor: pointer;
            outline: none;
            transition: opacity 0.05s;
        }
        .push-button:active {
            opacity: 0.7;
        }

        /* --- ホスト画面 --- */
        #host-screen {
            background-color: #222222;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 50px 20px;
        }

        .judge-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            outline: none;
            transition: opacity 0.05s;
        }
        .judge-btn:active {
            opacity: 0.7;
        }

        .judge-btn.correct { background-color: #e53935; }
        .judge-btn.incorrect { background-color: #1e88e5; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 役割選択画面 -->
    <div id="role-select-screen">
        <button id="player-btn" class="role-card" type="button">
            <div class="icon-player">
                <div class="big-circle"></div>
                <div class="small-circle"></div>
            </div>
        </button>

        <button id="host-btn" class="role-card" type="button">
            <div class="icon-host">
                <div class="circle"></div>
                <div class="circle"></div>
            </div>
        </button>
    </div>

    <!-- 解答者画面 -->
    <div id="player-screen" class="hidden">
        <div class="lamp-container">
            <div id="lamp" class="quiz-lamp"></div>
        </div>
        <div class="button-container">
            <button id="push-btn" class="push-button" type="button"></button>
        </div>
    </div>

    <!-- ホスト画面 -->
    <div id="host-screen" class="hidden">
        <button id="correct-btn" class="judge-btn correct" type="button"></button>
        <button id="incorrect-btn" class="judge-btn incorrect" type="button"></button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 固定の共有ルームID
            const ROOM_ID = 'quizbutton_shared_room_default_id';
            
            let peer = null;
            let hostConnection = null;
            let playerConnections = [];
            let myRole = null;
            let isAnswered = false;

            const roleSelectScreen = document.getElementById('role-select-screen');
            const playerBtn = document.getElementById('player-btn');
            const hostBtn = document.getElementById('host-btn');
            const playerScreen = document.getElementById('player-screen');
            const hostScreen = document.getElementById('host-screen');
            const lamp = document.getElementById('lamp');
            const pushBtn = document.getElementById('push-btn');

            function triggerVibrate(ms = 50) {
                if ('vibrate' in navigator) {
                    navigator.vibrate(ms);
                }
            }

            // Web Audio API
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const FREQ_F_SHARP = 1479.98;
            const FREQ_D = 1174.66;
            const FREQ_A_WRONG = 220.00;

            function playSound(type) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;

                if (type === 'push') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(FREQ_F_SHARP, now);
                    osc.frequency.setValueAtTime(FREQ_D, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.setValueAtTime(0.12, now + 0.395);
                    gain.gain.setValueAtTime(0.001, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'correct') {
                    const tempo = 0.08; 
                    for (let i = 0; i < 3; i++) {
                        const startOffset = now + (i * tempo * 2.2);
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sawtooth';
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.frequency.setValueAtTime(FREQ_F_SHARP, startOffset);
                        osc.frequency.setValueAtTime(FREQ_D, startOffset + tempo);
                        gain.gain.setValueAtTime(0.12, startOffset);
                        if (i === 2) {
                            const duration = 0.55;
                            gain.gain.setValueAtTime(0.12, startOffset + duration - 0.005);
                            gain.gain.setValueAtTime(0.001, startOffset + duration);
                            osc.start(startOffset);
                            osc.stop(startOffset + duration);
                        } else {
                            gain.gain.setValueAtTime(0.12, startOffset + tempo * 1.9);
                            gain.gain.setValueAtTime(0.001, startOffset + tempo * 2.0);
                            osc.start(startOffset);
                            osc.stop(startOffset + tempo * 2.0);
                        }
                    }
                } else if (type === 'incorrect') {
                    const notes = [0, 0.14]; 
                    notes.forEach((offset, index) => {
                        const startOffset = now + offset;
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sawtooth';
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.frequency.setValueAtTime(FREQ_A_WRONG, startOffset);
                        gain.gain.setValueAtTime(0.15, startOffset);
                        if (index === 1) {
                            gain.gain.setValueAtTime(0.15, startOffset + 0.545);
                            gain.gain.setValueAtTime(0.001, startOffset + 0.55);
                            osc.start(startOffset);
                            osc.stop(startOffset + 0.55);
                        } else {
                            gain.gain.setValueAtTime(0.15, startOffset + 0.125);
                            gain.gain.setValueAtTime(0.001, startOffset + 0.13);
                            osc.start(startOffset);
                            osc.stop(startOffset + 0.13);
                        }
                    });
                }
            }

            function triggerShake(element) {
                element.classList.remove('shake-error');
                void element.offsetWidth;
                element.classList.add('shake-error');
            }

            // --- ホストとして起動（右側ボタン） ---
            hostBtn.addEventListener('click', () => {
                triggerVibrate(30);

                if (peer) peer.destroy();
                peer = new Peer(ROOM_ID);

                peer.on('open', () => {
                    myRole = 'host';
                    roleSelectScreen.classList.add('hidden');
                    hostScreen.classList.remove('hidden');
                });

                peer.on('connection', (conn) => {
                    playerConnections.push(conn);

                    conn.on('data', (data) => {
                        if (data.type === 'PUSH' && !isAnswered) {
                            isAnswered = true;
                            // 1番目に押した人に点灯を指示
                            conn.send({ type: 'LIGHT_ON' });
                        }
                    });

                    conn.on('close', () => {
                        playerConnections = playerConnections.filter(c => c !== conn);
                    });
                });

                // 既にホストが存在する場合はエラーシェイク
                peer.on('error', (err) => {
                    triggerShake(hostBtn);
                });
            });

            // --- 解答者として起動（左側ボタン） ---
            playerBtn.addEventListener('click', () => {
                triggerVibrate(30);

                if (peer) peer.destroy();
                peer = new Peer();

                peer.on('open', () => {
                    hostConnection = peer.connect(ROOM_ID);

                    let connected = false;

                    hostConnection.on('open', () => {
                        connected = true;
                        myRole = 'player';
                        roleSelectScreen.classList.add('hidden');
                        playerScreen.classList.remove('hidden');
                    });

                    hostConnection.on('data', (data) => {
                        if (data.type === 'LIGHT_ON') {
                            lamp.classList.add('active');
                            playSound('push');
                        }
                        if (data.type === 'RESET') {
                            lamp.classList.remove('active');
                        }
                        if (data.type === 'CORRECT_SOUND') playSound('correct');
                        if (data.type === 'INCORRECT_SOUND') playSound('incorrect');
                    });

                    // 1.5秒以内にホストと接続できない場合はエラーシェイク
                    setTimeout(() => {
                        if (!connected) {
                            triggerShake(playerBtn);
                            peer.destroy();
                        }
                    }, 1500);
                });

                peer.on('error', () => {
                    triggerShake(playerBtn);
                });
            });

            // 解答者：早押しボタン
            pushBtn.addEventListener('click', () => {
                triggerVibrate(50);
                if (myRole === 'player' && hostConnection && hostConnection.open) {
                    hostConnection.send({ type: 'PUSH' });
                }
            });

            // ホストから全解答者への一括送信
            function broadcastToPlayers(data) {
                playerConnections.forEach(conn => {
                    if (conn.open) conn.send(data);
                });
            }

            // ホスト：正解ボタン
            document.getElementById('correct-btn').addEventListener('click', () => {
                triggerVibrate(30);
                if (myRole !== 'host' || !isAnswered) return;
                broadcastToPlayers({ type: 'CORRECT_SOUND' });
                broadcastToPlayers({ type: 'RESET' });
                isAnswered = false;
            });

            // ホスト：不正解ボタン
            document.getElementById('incorrect-btn').addEventListener('click', () => {
                triggerVibrate(30);
                if (myRole !== 'host' || !isAnswered) return;
                broadcastToPlayers({ type: 'INCORRECT_SOUND' });
                broadcastToPlayers({ type: 'RESET' });
                isAnswered = false;
            });
        });
    </script>
</body>
</html>
